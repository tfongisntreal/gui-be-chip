<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Quest v2.0 ❤️</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pixel-bg: rgba(20, 20, 35, 0.85); /* Nền hộp thoại xanh đen mờ */
            --pixel-border: #ff8da1; /* Viền hồng pastel */
            --pixel-font: #ffffff; 
            --pixel-accent: #ff8da1; 
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            
            /* NỀN PIXEL MỚI - HOÀNG HÔN LÃNG MẠN (Ổn định 100%) */
            background-image: url('https://media1.tenor.com/m/h9Xy60IksuQAAAAd/pixel-background.gif');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
        }

        /* Lớp phủ màu để chữ dễ đọc hơn trên nền cảnh */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        #gameInterface {
            z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            width: 90%; max-width: 650px;
            animation: float 3s ease-in-out infinite; /* Hiệu ứng trôi nổi nhẹ */
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Hộp thoại đẹp hơn */
        .dialogue-container {
            background-color: var(--pixel-bg);
            border: 4px solid var(--pixel-border);
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 141, 161, 0.4);
            display: flex;
            gap: 20px;
        }

        /* Avatar mèo Pixel */
        .avatar {
            width: 80px; height: 80px;
            border: 3px solid var(--pixel-border);
            border-radius: 5px;
            background-image: url('https://media1.tenor.com/m/5A8b_j7B7cAAAAAd/pixel-cat.gif');
            background-size: cover;
            image-rendering: pixelated;
        }

        .text-area { flex: 1; }

        .character-name {
            color: var(--pixel-accent);
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        .question-text {
            color: var(--pixel-font);
            font-size: 14px;
            line-height: 1.8;
            min-height: 80px; 
            text-shadow: 1px 1px 0px #000;
        }

        .pixel-heart {
            color: var(--pixel-accent);
            animation: heartBeat 0.8s infinite;
            display: inline-block;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .buttons-area {
            display: flex; justify-content: center; gap: 30px;
            margin-top: 30px; width: 100%; position: relative;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            padding: 15px 20px;
            border-radius: 0;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Nút Đồng ý */
        #yesBtn {
            background-color: var(--pixel-accent);
            color: #000;
            border: 4px solid #fff;
            position: relative;
            z-index: 2;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s;
        }

        #yesBtn:hover { transform: scale(1.05); }

        /* Nút Troll */
        #noBtn {
            background-color: #333;
            color: #fff;
            border: 4px solid #777;
            position: absolute; 
            z-index: 1;
            box-shadow: 4px 4px 0px #000;
            top: 0; left: 100px; /* Vị trí bắt đầu */
        }

        /* Giao diện lúc đồng ý xong */
        #resultContainer {
            z-index: 10; display: none; flex-direction: column; align-items: center;
        }

        .result-box {
            background-color: var(--pixel-bg);
            border: 4px solid var(--pixel-border);
            padding: 30px; text-align: center;
            box-shadow: 0 0 20px rgba(255, 141, 161, 0.4);
        }

        #resultGif {
            max-width: 250px; border: 4px solid #fff; margin-bottom: 20px;
            image-rendering: pixelated;
        }
        
        .result-text { color: #fff; font-size: 14px; line-height: 1.8; text-shadow: 2px 2px 0px #000; }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="gameInterface">
        <div class="dialogue-container">
            <div class="avatar"></div>
            
            <div class="text-area">
                <div class="character-name">PLAYER 1 (YOU)</div>
                <p id="typedText" class="question-text"></p>
            </div>
        </div>

        <div class="buttons-area">
            <button id="yesBtn">❤️ DONG Y!</button>
            <button id="noBtn">TU CHOI</button>
        </div>
    </div>

    <div id="resultContainer">
        <div class="result-box">
            <img src="https://media.tenor.com/EPHb97zR2YIAAAAi/pixel-couple-gaming.gif" id="resultGif" alt="Pixel Couple">
            <p class="result-text">QUEST COMPLETE!<br><br>Chuan bi don em be di choi thoi! <span class="pixel-heart">❤️</span></p>
        </div>
    </div>

    <script>
        // ĐÃ SỬA: Không dùng dấu để font không bị vỡ
        const fullMessage = "Hey Chip... Toi tim thay mot quest an rat dac biet. Phan thuong la ca the gioi nay va ca toi nua... Em co muon 'Play Together' tron doi khong?";
        const typingSpeed = 50; 

        let charIndex = 0;
        const textElement = document.getElementById("typedText");

        function typeWriter() {
            if (charIndex < fullMessage.length) {
                textElement.innerHTML += fullMessage.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                textElement.innerHTML += ' <span class="pixel-heart">❤️</span>';
            }
        }

        window.onload = typeWriter;

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const gameInterface = document.getElementById('gameInterface');
        const resultContainer = document.getElementById('resultContainer');

        function moveButton() {
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            const newX = Math.floor(Math.random() * maxX);
            const newY = Math.floor(Math.random() * maxY);
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton);

        yesBtn.addEventListener('click', () => {
            gameInterface.style.display = "none";
            resultContainer.style.display = "flex";
        });
    </script>
</body>
</html>
