<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Bé Chip ❤️ [Love Quest v1.0]</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pixel-bg: rgba(0, 0, 0, 0.7); /* Màu nền hộp thoại */
            --pixel-border: #ffffff; /* Màu viền hộp thoại */
            --pixel-font: #ffffff; /* Màu chữ */
            --pixel-accent: #ff6b81; /* Màu hồng lãng mạn */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            background-color: #1a1a2e; /* Màu nền tối để tôn cảnh pixel */
        }

        /* --- 1. HÌNH NỀN PIXEL (Peaceful/Romantic) --- */
        /* M có thể thay link ảnh dưới đây bằng ảnh m thích */
        .game-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url('https://i.gifer.com/L4u3.gif'); /* Ví dụ cảnh đêm pixel yên bình */
            background-size: cover;
            background-position: center;
            filter: blur(1px) brightness(0.9); /* Làm mờ nhẹ nền để nổi hộp thoại */
            z-index: -1;
        }

        /* Thêm hiệu ứng phủ màu lãng mạn nhẹ (màu hồng hoàng hôn) */
        .color-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(255, 107, 129, 0.1);
            z-index: 0;
        }

        /* --- 2. HỘP THOẠI GAME RPG (Text Box) --- */
        #gameInterface {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 600px;
        }

        .dialogue-container {
            background-color: var(--pixel-bg);
            border: 4px solid var(--pixel-border);
            border-radius: 5px;
            padding: 25px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 10px 0 rgba(0,0,0,0.5); /* Đổ bóng kiểu pixel */
        }

        /* Viền pixel giả lập */
        .dialogue-container::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 2px solid var(--pixel-border);
            opacity: 0.5;
            pointer-events: none;
        }

        /* --- 3. FONT CHỮ PIXEL & HIỆU ỨNG ĐÁNH MÁY --- */
        .question-text {
            color: var(--pixel-font);
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 1px;
            margin: 0;
            min-height: 60px; /* Giữ chỗ cho chữ hiện ra */
        }

        /* Tên nhân vật (ví dụ: Bé Chip) */
        .character-name {
            color: var(--pixel-accent);
            font-size: 18px;
            margin-bottom: 10px;
            text-align: left;
            width: 100%;
        }

        /* Trái tim pixel lấp lánh */
        .pixel-heart {
            color: var(--pixel-accent);
            animation: heartBeat 1s infinite;
            display: inline-block;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* --- 4. NÚT BẤM GAME 2D --- */
        .buttons-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            position: relative;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            padding: 15px 25px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
            image-rendering: pixelated; /* Giữ pixel sắc nét */
        }

        /* Nút Có (DONG Y) */
        #yesBtn {
            background-color: var(--pixel-accent);
            color: white;
            border: 4px solid #cc4e60; /* Viền sậm hơn */
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 0 #cc4e60;
        }

        #yesBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #cc4e60;
        }

        #yesBtn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cc4e60;
        }

        /* Thêm icon pixel trước chữ 'Đồng ý' */
        #yesBtn::before {
            content: '❤️ ';
        }

        /* Nút troll (Maybe Later) */
        #noBtn {
            background-color: #6c757d;
            color: white;
            border: 4px solid #495057;
            position: absolute; /* Quan trọng để chạy trốn */
            z-index: 1;
            box-shadow: 0 4px 0 #495057;
        }

        /* --- 5. GIAO DIỆN KẾT QUẢ (Happy Ending) --- */
        #resultContainer {
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 600px;
        }

        .result-box {
            background-color: rgba(0, 0, 0, 0.8);
            border: 4px solid var(--pixel-accent);
            border-radius: 5px;
            padding: 30px;
            text-align: center;
        }

        #resultGif {
            max-width: 250px;
            border: 4px solid white;
            border-radius: 5px;
            margin-bottom: 20px;
            image-rendering: pixelated;
        }

        .result-text {
            color: white;
            font-size: 16px;
            line-height: 1.6;
        }

    </style>
</head>
<body>

    <div class="game-background"></div>
    <div class="color-overlay"></div>

    <div id="gameInterface">
        <div class="dialogue-container">
            <div class="character-name">SYSTEM (Love Quest)</div>
            <p id="typedText" class="question-text"></p>
        </div>

        <div class="buttons-area">
            <button id="yesBtn">DONG Y!</button>
            <button id="noBtn">Maybe Later</button>
        </div>
    </div>

    <div id="resultContainer">
        <div class="result-box">
            <img src="https://media.tenor.com/EPHb97zR2YIAAAAi/pixel-couple-gaming.gif" id="resultGif" alt="Pixel Couple GIF">
            <p class="result-text">Quest Complete!<br>Let's build our pixel perfect world together! <span class="pixel-heart">❤️</span></p>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH ---
        // Nội dung câu hỏi m muốn gửi Bé Chip (Viết không dấu để font pixel hiện đẹp nhất)
        const fullMessage = "Hey, Chip... Toi tim thay mot quest ẩn rat dac biet. Phan thuong la ca the gioi pixel va... ca anh nua. Em co muon 'Play Together' tron doi khong? ❤️";
        const typingSpeed = 60; // Tốc độ gõ chữ (ms/chữ), càng nhỏ càng nhanh

        // --- XỬ LÝ TEXT ĐÁNH MÁY ---
        let charIndex = 0;
        const textElement = document.getElementById("typedText");

        function typeWriter() {
            if (charIndex < fullMessage.length) {
                textElement.innerHTML += fullMessage.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                // Khi gõ xong, thêm trái tim pixel lấp lánh (nếu có dấu ❤️ ở cuối)
                textElement.innerHTML = textElement.innerHTML.replace('❤️', '<span class="pixel-heart">❤️</span>');
            }
        }

        // Bắt đầu hiệu ứng gõ chữ ngay khi web tải xong
        window.onload = typeWriter;


        // --- XỬ LÝ NÚT TROLL CHẠY TRỐN ---
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const gameInterface = document.getElementById('gameInterface');
        const resultContainer = document.getElementById('resultContainer');

        function moveButton() {
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            const newX = Math.floor(Math.random() * maxX);
            const newY = Math.floor(Math.random() * maxY);
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
        }

        // Di chuyển trên máy tính
        noBtn.addEventListener('mouseover', moveButton);
        // Di chuyển trên điện thoại
        noBtn.addEventListener('touchstart', moveButton);

        // --- XỬ LÝ NÚT CÓ (HAPPY ENDING) ---
        yesBtn.addEventListener('click', () => {
            gameInterface.style.display = "none";
            resultContainer.style.display = "flex";
        });
    </script>
</body>
</html>
